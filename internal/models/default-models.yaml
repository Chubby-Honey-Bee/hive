# ─── Tier roles × budget modes ────────────────────────────────────
#
# Each tier has five model slots. Empty slots gracefully degrade:
#   standard → premium    (when standard slot is unset)
#   cheap    → standard   (when cheap slot is unset)
#   fallback → primary    (when fallback slot is unset)
#   free     → primary    (when free slot is unset)
#
# Roles:
#   planner    — decompose, route, decide structure (top-tier reasoning)
#   synthesist — aggregate, evaluate, gate (mid-tier integration)
#   worker     — fan-out leaf execution (cheap fast model)
#   verifier   — code-tuned mechanical checks (codex-aware default)
tiers:
  planner:
    premium: claude-opus-4-8
    standard: claude-sonnet-4-6
    cheap: claude-haiku-4-5
    fallback: claude-opus-4-6
    free: gpt-5.5
  synthesist:
    premium: claude-sonnet-4-6
    standard: claude-haiku-4-5
    cheap: claude-haiku-4-5
    fallback: gemini-2.5-pro
    free: gpt-5.2
  worker:
    premium: claude-haiku-4-5
    standard: claude-haiku-4-5
    cheap: claude-haiku-4-5
    fallback: gpt-5.4-mini
    free: gpt-5-mini
  verifier:
    premium: gpt-5.3-codex
    standard: claude-sonnet-4-6
    cheap: claude-haiku-4-5
    fallback: claude-sonnet-4-6
    free: gpt-5-mini

# ─── Aliases (workflow YAML shorthand → canonical id) ─────────────
#
# Lets a workflow author write `model: sonnet` and get the right
# per-provider model id at dispatch time. Aliases are case-insensitive
# and trimmed.
aliases:
  haiku: claude-haiku-4-5
  sonnet: claude-sonnet-4-6
  opus: claude-opus-4-8
  pro: gemini-2.5-pro
  flash: gemini-2.5-flash

# ─── The hive's model-tier ladder ─────────────────────────────────
#
# Cheapest first. The hive's tier rule moves hive_state.model_tier one
# rung up while unknowns dominate the latest wave, at most once per two
# scans, and one rung back after three scans in a row on which unknowns are
# at most a quarter of it; `chb hive init` starts at the middle rung
# (rounding down). Under a routing profile the ladder is the profile's
# hive_tiers, else its hive-research model alone.
hive_tiers: [haiku, sonnet, opus]

# ─── Routing profiles ─────────────────────────────────────────────
#
# `chb ask|agent-run|preflight|review|implement|proof|agent-harness
# --profile <name>` (or HIVE_PROFILE) routes every workflow node that
# names a `role:` as its role's entry says: model (required), provider,
# reasoning (none|low|medium|high), tools (a list; [] gives none) and ttl
# (the bound on each call, a Go duration). A field left out keeps what the
# node declares. The profile's `provider:` serves a role that names none,
# and is the run's default provider.
#
# `default:` is a route of the same shape for every model node that no role
# route serves and that names no model and no provider of its own, such as
# a node that names only a `tier:`: the shipped workflows whose nodes name
# no role, and workflows of your own. It stays on this machine. A node that
# names a model or a provider of its own, and no role the profile routes,
# runs as written.
#
# Roles: scope, lens, evaluate, followup, queen (chb ask); hive-research,
# evaluate, hive-synthesis (workflows/hive.yaml); review-lens,
# review-synthesis (chb review); implement-plan, implement-fix,
# implement-repair (chb implement; the repair role is the fix nodes'
# on_reject model).
#
# `provider: local` is the OpenAI-compatible server at
# HIVE_LOCAL_BASE_URL (default http://localhost:11434/v1, Ollama). A
# route is local only on `provider: local` with a model that is not an
# Ollama cloud tag (`:cloud`, `-cloud`); `provider: openai` is a cloud route
# even at a localhost OPENAI_BASE_URL. Any other route leaves this machine
# and must say why in `because:`, naming the measured evidence that no local
# model is sufficient for the role (a Bench-1 report); chb checks that it is
# there, not what it says. A cloud route lets only its own role leave: a
# profile refuses a run in which any other call would send data off the
# machine. Every run and `chb preflight` print the routing.
#
# These three come from Bench-0 (Ollama 0.34.4, 2026-09-25): with the
# schema enforced at decode and thinking off (reasoning none), every call
# gave schema-valid output; qwen3.6:35b-a3b-q4_K_M answered in a median of
# 5 s (max 26 s) and qwen3.5:4b in 6.6 s (max 10.3 s). That measured the
# shape and the speed of single calls, not the quality of the answers, and
# no tool loop. The roles that run one (hive-research, review-lens,
# review-synthesis, implement-fix), and the default route, whose nodes keep
# their tools, are routed on that bet.
#
# A cloud fallback for one role goes in ~/.config/hive/models.yaml. A
# profile there replaces the shipped one of the same name whole, so copy
# its default route and every role and change the one. The Anthropic API
# needs ANTHROPIC_API_KEY (or ANTHROPIC_AUTH_TOKEN), or the run is refused
# before it starts:
#
#   profiles:
#     local-small-cloud-queen:
#       description: local-small, with Queen on the Anthropic API
#       quality: unvalidated
#       provider: local
#       default: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, ttl: 5m}
#       roles:
#         # ...every other role as local-small has it...
#         queen:
#           model: claude-opus-4-8
#           provider: anthropic
#           tools: []
#           because: "Bench-1 <report>: qwen3.6:35b-a3b-q4_K_M Queen failed non-inferiority at δ=0.15"
profiles:
  local-fast:
    description: qwen3.6:35b-a3b-q4_K_M in every role and on every node no role routes, thinking off, on this machine
    quality: measured by Bench-1 on 2026-10-01 (4 seeds, 56 items per arm, Ollama 0.35.0); on closed roster questions the swarm scored 0.82 and one call of the same model 0.95, so it is not the more accurate way to answer one; its quorum is calibrated, a verdict the Queen called high convergence was right 26 of 26 times and a lens tie 0 of 5; about 2.5 min a swarm on Bench-1's short items and 2 to 7 min on an open question (runs on 2026-10-06 and 2026-10-08), longer while the machine is busy
    provider: local
    default: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, ttl: 5m}
    roles:
      scope: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, tools: [], ttl: 5m}
      lens: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, ttl: 5m}
      evaluate: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, tools: [], ttl: 5m}
