# Source-of-truth config for every model the runner knows about.
#
# Five sections:
#
#   models:  per-model pricing ($/1M tokens) + Copilot premium-request
#            multiplier + family. Used by the cost meter.
#   tiers:   per-role × per-budget-mode model selection. Used by the
#            workflow engine when a node sets `tier:` instead of `model:`.
#   aliases: short names that resolve to canonical model ids. Used so a
#            workflow can write `model: sonnet` and get the right
#            per-provider model id at dispatch time.
#   hive_tiers: the hive's model-tier ladder, cheapest first.
#   profiles: named routing profiles (--profile, HIVE_PROFILE): each
#            maps the roles a workflow node names with `role:` to a
#            model, provider, reasoning level, tools and TTL, and its
#            default route serves the nodes no role routes.
#
# This file ships embedded in the binary (internal/models/embed.go).
# Users can override any subset by writing
# ~/.config/hive/models.yaml — the loader merges user entries on
# top of the defaults so partial overrides are safe (e.g. you only
# need to ship a `models.gpt-5.6` entry to add a new model without
# re-specifying every existing one).
#
# Cost dial:
#   premium  → tier.premium  slot
#   standard → tier.standard slot   (default — middle gear)
#   cheap    → tier.cheap    slot
#   free     → tier.free     slot
#
# Last updated: 2026-09-28 (the Claude and Gemini prices, read that day)

last_updated: "2026-09-28"

