      queen: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, tools: [], ttl: 5m}
      hive-research: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, ttl: 5m}
      hive-synthesis: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, tools: [], ttl: 5m}
      review-lens: {model: qwen3.6:35b-a3b-q4_K_M, reasoning: none, ttl: 5m}
