name: Publish container image

# Builds the HIVE image for linux/amd64 and linux/arm64 and pushes a
# multi-arch manifest to GitHub Container Registry. The image carries
# BOTH binaries, `chb-mcp` as its entrypoint and `chb` beside it, so a
# single `docker pull` is enough for both.
#
# Each architecture is built on a native runner. The CLI providers the
# image installs (@anthropic-ai/claude-code, @google/gemini-cli) ship
# per-platform native binaries whose postinstall crashes under QEMU
# (SIGILL), so cross-building arm64 on an amd64 runner is not an option.
#
# The image name is ghcr.io/<owner-lowercased>/hive, so the workflow is
# green from any fork or staging repo and publishes to
# ghcr.io/chubby-honey-bee/hive from the release repository.
#
# Tags emitted:
#   :latest         — every push to main
#   :sha-<short>    — every push (immutable)
#   :X.Y.Z, :X.Y    — when a vX.Y.Z tag is pushed (the semver patterns
#                     drop the leading v)
#
# Triggered on push to main + version tags + manual dispatch.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name (owner lowercased — Docker refuses uppercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hive" >> "$GITHUB_OUTPUT"

      # The version the binaries report: the tag without its v, as the
      # release archives' binaries report it; a branch name as it is.
      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.build.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # Word splitting is the point: each tag and each digest must become
          # its own argument (docker/metadata-action's documented pattern).
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.build.outputs.image }}@sha256:%s ' *)

      - name: Smoke test the published manifest
        run: |
          docker buildx imagetools inspect "${{ needs.build.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker pull "${{ needs.build.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker run --rm "${{ needs.build.outputs.image }}:${{ steps.meta.outputs.version }}" --version
