name: CI

# One workflow, four jobs, no duplicated gates:
#   gate           the same checks as `make gate`: vet, gofmt, race tests,
#                  build, chb validate, replay-behavior, mcp-smoke, preflight
#   cross-compile  both binaries for linux/darwin/windows × amd64/arm64
#   windows        build, vet, and the tests that run with no Unix shell,
#                  the shell tool's own among them, on windows-latest
#   docker         image builds, answers the MCP handshake over stdio and
#                  --version / validate / preflight, and carries LICENSE
#
# Runs on GitHub-hosted runners so forks and outside PRs execute. No
# provider credentials: the harnesses pin a placeholder key themselves.
#
# Keep the path lists in step with what these jobs read. `go test ./...`
# reads docs/assumptions.md and docs/specs/swarm.md and compiles
# lean4/bridge; the image build copies agents/ and
# LICENSE through .dockerignore.

on:
  push:
    branches: [main]
    paths:
      - 'assets.go'
      - 'cmd/**'
      - 'internal/**'
      - 'workflows/**'
      - 'foragers/**'
      - 'fixtures/**'
      - 'agents/**'
      - 'docs/**'
      - 'lean4/bridge/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - 'README.md'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'assets.go'
      - 'cmd/**'
      - 'internal/**'
      - 'workflows/**'
      - 'foragers/**'
      - 'fixtures/**'
      - 'agents/**'
      - 'docs/**'
      - 'lean4/bridge/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'LICENSE'
      - 'README.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate on Go ${{ matrix.go }} (vet · race tests · validate · replay · smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Both supported Go releases: the oldest is go.mod's minimum, so code that
    # reaches for a newer standard library fails here rather than for a user.
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt clean
        run: |
          drift=$(gofmt -l cmd internal lean4 assets.go assets_test.go fixtures)
          if [ -n "$drift" ]; then echo "gofmt drift in:"; echo "$drift"; exit 1; fi

      - name: go test -race
        run: go test -race -count=1 -timeout=900s ./...

      - name: Build binaries onto $PATH
        run: |
          mkdir -p "$HOME/bin"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$HOME/bin/chb"     ./cmd/chb
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$HOME/bin/chb-mcp" ./cmd/chb-mcp
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: chb validate
        run: chb validate

      - name: chb replay-behavior (21 fixtures)
        run: chb replay-behavior --bin "$HOME/bin/chb" --keep-going

      - name: chb mcp-smoke (20 tools)
        run: chb mcp-smoke --mcp-bin "$HOME/bin/chb-mcp"

      - name: every workflow passes preflight
        # --skip-provider-check: the runner has no API key and no CLI, and
        # provider auth is a property of the launching machine, not of the
        # workflow. Everything else (YAML, accept: coverage, prompt language,
        # target dir, fixtures) is checked.
        run: |
          fails=0
          for w in workflows/*.yaml; do chb preflight --skip-provider-check "$w" >/dev/null 2>&1 || { echo "FAIL $w"; fails=$((fails+1)); }; done
          test "$fails" -eq 0

      - name: Upload validate log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: workspace/self-validation/self-validate.log
          retention-days: 14
          if-no-files-found: ignore

  cross-compile:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Build both binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/chb-$GOOS-$GOARCH$ext"     ./cmd/chb
          go build -trimpath -ldflags="-s -w" -o "dist/chb-mcp-$GOOS-$GOARCH$ext" ./cmd/chb-mcp
      - name: Smoke (linux/amd64 is the only tuple the runner can execute)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/chb-linux-amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: chb-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 14

  windows:
    name: windows (build · vet · tests with no Unix shell)
    runs-on: windows-latest
    timeout-minutes: 20
    # The runner's shell is pwsh, and each step is one command, so a failing
    # command fails its step: pwsh carries only the last command's exit code
    # out of a multi-line step.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet (compiles every test)
        run: go vet ./...
      # The package list is explicit: `./...` cannot pass here. Excluded,
      # and why:
      #   internal/cli, internal/mcp, lean4/bridge: tests run bash, sh, zsh
      #     or scripts/*.sh through os/exec
      #   internal/harness: tests build chb and drive runs whose lenses send
      #     bash commands through the shell tool
      #   internal/endpointslot: flock, which the Windows build has not
      #   internal/runner: most tests run commands through bash or sh; the
      #     shell tool's own tests run in the step below
      #   internal/db, artifact, calibration, cde, comb, design, dreamer,
      #     embed, foragers, gate, hive, mss, review: SQLite stores under
      #     t.TempDir(), not yet shown to pass where Windows refuses to
      #     remove a file still open. internal/workflow opens a store the
      #     same way and runs here because the shell tool's names live in
      #     it; its result on this job is the evidence for adding the rest.
      # chb validate is not run: nothing has shown its assertions pass
      # on Windows, and a failure among them would not isolate the tool.
      - name: go test (packages that need no Unix shell)
        run: go test -count=1 ./internal/workflow ./internal/bench ./internal/citations ./internal/models ./internal/schema ./internal/useragent
      # TestShellTool_EveryShellOnThisMachineRunsACommand runs a command
      # through each shell on the runner: bash (Git for Windows), pwsh,
      # powershell and cmd. -v so the log says which ran.
      - name: go test (the shell tool, through every shell on the runner)
        run: go test -count=1 -v ./internal/runner -run '^Test(Shell|ResolveShell)'

  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (layer cache in the Actions cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke — version, validate, preflight, license
        run: |
          # The entrypoint is chb-mcp; chb sits beside it at /usr/local/bin/chb.
          docker run --rm chb:ci --version
          docker run --rm --entrypoint /usr/local/bin/chb chb:ci --version
          # MIT requires the notice in every copy of the binaries.
          docker run --rm --entrypoint cat chb:ci /app/LICENSE | cmp - LICENSE
          docker run --rm --entrypoint /usr/local/bin/chb chb:ci workflow validate workflows/proof.yaml
          set +e; docker run --rm --entrypoint /usr/local/bin/chb chb:ci preflight workflows/proof.yaml; rc=$?; set -e
          # 0 (a provider happened to resolve) or 1 (preflight failed cleanly) are both fine; ≥2 is a crash.
          test "$rc" -lt 2
      - name: Smoke — non-root, an MCP server over stdio, chb validate in the image
        run: |
          test "$(docker run --rm --entrypoint id chb:ci -u)" != 0
          # initialize + tools/list on stdin: the image's chb-mcp answers both and exits on EOF.
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run --rm -i chb:ci > mcp.out
          jq -e 'select(.id==1) | .result.protocolVersion' mcp.out
          test "$(jq -r 'select(.id==2) | .result.tools | length' mcp.out)" = 20
          # The regression gate, as an installed binary: no cmd/ to build, so §21 is a warning.
          docker run --rm --entrypoint /usr/local/bin/chb chb:ci validate
